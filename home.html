<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home page GitHub issues tracker</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- DaisyUI -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@latest/dist/full.css"
      rel="stylesheet"
      type="text/css"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <!-- font family -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Geist", sans-serif;
      }
    </style>
  </head>
  <body>
    <!-- header section -->
    <section class="header-section">
      <!-- container -->
      <div class="md:w-11/12 mx-auto p-3">
        <!-- header container -->
        <div class="header-container md:flex md:justify-between space-y-3">
          <!-- img -->
          <div class="flex items-center gap-1">
            <img class="w-8" src="assets/github-logo.png" alt="" />
            <h1 class="text-xl font-bold">GitHub Issues Tracker</h1>
          </div>

          <!-- search input -->
          <div class="relative join w-full max-w-md">
            <i
              class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"
            ></i>

            <input
            id="searchInput"
              type="search"
              placeholder="Search issues..."
              required
              class="input input-bordered join-item w-full pl-8 py-3"
            />
            <button  id="newIssueBtn" type="button" class="btn btn-primary join-item rounded-lg">
              <i class="fa-solid fa-plus"></i> New Issue
            </button>
          </div>
        </div>
      </div>
    </section>
    <hr class="w-full" />

    <!-- tab section -->
    <section class="tab-section py-5 md:pt-12">
      <!-- container -->
      <div class="max-w-screen-2xl mx-auto shadow-md p-3 rounded-lg">
        <!-- tab container -->
        <div class="tab-container flex gap-2">
          <!-- all tab -->
          <button id="all-tab" class="btn w-24 bg-blue-500 text-white">
            All
          </button>
          <!-- open tab  -->
          <button id="open-tab" class="btn w-24 bg-gray-100 text-black">
            Open
          </button>
          <!-- closed tab -->
          <button id="closed-tab" class="btn w-24 bg-gray-100 text-black">
            Closed
          </button>
        </div>
      </div>
    </section>

    <!-- issue section -->
    <section class="issue-section py-5">
      <!-- container -->
      <div class="max-w-screen-2xl mx-auto shadow-md p-3 rounded-lg">
        <!-- issue container -->
        <div class="issue-container flex justify-between items-center">
          <div class="flex gap-2 items-center">
            <img class="w-8 h-8" src="assets/Aperture.png" alt="issue-icon" />
            <div>
              <h2 class="md:text-lg font-bold">
                <span id="issue-count">50</span> Issues
              </h2>
              <p class="text-xs md:text-base text-gray-500">
                Track and manage your project issues
              </p>
            </div>
          </div>

          <!-- open closed -->
          <div class="flex gap-2">
            <p class="flex items-center gap-1">
              <i class="fa-solid fa-circle text-[#00A96E]"></i> Open
            </p>
            <p class="flex items-center gap-1">
              <i class="fa-solid fa-circle text-[#A855F7]"></i> Closed
            </p>
          </div>
        </div>
      </div>
    </section>

    <section class="card-section">
  <div class="max-w-screen-2xl mx-auto px-4 shadow-md p-4 rounded-lg">

    <!-- loader -->
    <div id="loader" class="flex justify-center py-3">
      <span class="loading loading-bars loading-xl"></span>
    </div>

    <!-- card-container -->
    <div id="all-issues"
      class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
    </div>

  </div>
</section>


   <dialog id="issue-modal" class="modal modal-bottom sm:modal-middle ">
  <div class="modal-box space-y-4">
    
    <h3 id="modal-title" class="text-lg font-bold">Fix broken image uploads</h3>

    <div class="flex flex-wrap gap-2 items-center">
      <p id="modal-status" class="text-base font-medium flex items-center gap-1 py-1 px-3 rounded-lg bg-[#00A96E]">Opened</p>
      <p id="modal-author" class="py-4 text-[#64748B]">• Opened by Fahim Ahmed</p>
      <p id="modal-date" class="md:py-4 text-[#64748B]">• 22/02/2026</p>
    </div>

    <div class="flex gap-3 items-center">
      <p class="text-base font-medium flex items-center gap-1 bg-[#FEECEC] px-3 rounded-full py-1 text-[#EF4444]">
        <i class="fa-solid fa-bug"></i> BUG
      </p>
      <p class="text-base font-medium flex items-center gap-1 bg-[#FDE68A] px-4 rounded-full py-1 text-[#D97706]">
        <i class="fa-solid fa-life-ring"></i> HELP WANTED
      </p>
    </div>

    <div class="grid grid-cols-2 mt-4  ">
      <div>
        <p class="text-[#64748B]">Assignee:</p>
        <h2 id="modal-assignee" class="font-bold">Salauddin khan</h2>
      </div>

      <div class="">
        <p class="text-[#64748B]">Priority:</p>
        <h2 id="modal-priority" class="text-base font-medium flex items-center   bg-[#FEECEC]  px-4 gap-4 text-center  w-20 rounded-lg py-1 text-[#EF4444]">High</h2>
      </div>
    </div>

    <div class="modal-action">
      <form method="dialog">
        <button class="btn btn-primary">Close</button>
      </form>
    </div>

  </div>
</dialog>


  
  </body>
</html>

<script src="home.js"></script>
