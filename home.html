<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home page GitHub issues tracker</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- DaisyUI -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@latest/dist/full.css"
      rel="stylesheet"
      type="text/css"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <!-- font family -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Geist", sans-serif;
      }
    </style>
  </head>
  <body>
    <!-- header section -->
    <section class="header-section">
      <!-- container -->
      <div class="md:w-11/12 mx-auto p-3">
        <!-- header container -->
        <div class="header-container md:flex md:justify-between space-y-3">
          <!-- img -->
          <div class="flex items-center gap-1">
            <img class="w-8" src="assets/github-logo.png" alt="" />
            <h1 class="text-xl font-bold">GitHub Issues Tracker</h1>
          </div>

          <!-- search input -->
          <div class="relative join w-full max-w-md">
            <i
              class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"
            ></i>

            <input
            id="searchInput"
              type="search"
              placeholder="Search issues..."
              required
              class="input input-bordered join-item w-full pl-8 py-3"
            />
            <button  id="newIssueBtn" type="button" class="btn btn-primary join-item rounded-lg">
              <i class="fa-solid fa-plus"></i> New Issue
            </button>
          </div>
        </div>
      </div>
    </section>
    <hr class="w-full" />

    <!-- tab section -->
    <section class="tab-section py-5 md:pt-12">
      <!-- container -->
      <div class="max-w-screen-2xl mx-auto shadow-md p-3 rounded-lg">
        <!-- tab container -->
        <div class="tab-container flex gap-2">
          <!-- all tab -->
          <button id="all-tab" class="btn w-24 bg-blue-500 text-white">
            All
          </button>
          <!-- open tab  -->
          <button id="open-tab" class="btn w-24 bg-gray-100 text-black">
            Open
          </button>
          <!-- closed tab -->
          <button id="closed-tab" class="btn w-24 bg-gray-100 text-black">
            Closed
          </button>
        </div>
      </div>
    </section>

    <!-- issue section -->
    <section class="issue-section py-5">
      <!-- container -->
      <div class="max-w-screen-2xl mx-auto shadow-md p-3 rounded-lg">
        <!-- issue container -->
        <div class="issue-container flex justify-between items-center">
          <div class="flex gap-2 items-center">
            <img class="w-8 h-8" src="assets/Aperture.png" alt="issue-icon" />
            <div>
              <h2 class="md:text-lg font-bold">
                <span id="issue-count">50</span> Issues
              </h2>
              <p class="text-xs md:text-base text-gray-500">
                Track and manage your project issues
              </p>
            </div>
          </div>

          <!-- open closed -->
          <div class="flex gap-2">
            <p class="flex items-center gap-1">
              <i class="fa-solid fa-circle text-[#00A96E]"></i> Open
            </p>
            <p class="flex items-center gap-1">
              <i class="fa-solid fa-circle text-[#A855F7]"></i> Closed
            </p>
          </div>
        </div>
      </div>
    </section>

    <!--card section  -->
    <section class="card-section">
      <!-- container -->
      <div class="max-w-screen-2xl mx-auto shadow-md p-4 rounded-lg">

        <!-- loader -->
        <div id="loader" class="flex justify-center py-3">
          <span class="loading loading-bars loading-xl"></span>
        </div>

 
        <!-- card-container -->
        <div id="all-issues" class="card-container grid sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">

        </div>
      </div>
    </section>
  </body>
</html>

<script>
  const loader = document.getElementById("loader");
const cardContainer = document.getElementById("all-issues");
const searchInput = document.getElementById("searchInput");

const allTab = document.getElementById("all-tab");
const openTab = document.getElementById("open-tab");
const closedTab = document.getElementById("closed-tab");

const issueCount = document.getElementById("issue-count");

let issuesData = []; // store all issues
let activeTab = "all"; // default

// Fetch issues once
async function fetchIssues() {
  loader.style.display = "flex";
  try {
    const res = await fetch("https://phi-lab-server.vercel.app/api/v1/lab/issues");
    const data = await res.json();
    issuesData = data.data;
    renderCards(issuesData);
  } catch (err) {
    console.error("Fetch Error:", err);
    cardContainer.innerHTML = '<p class="text-red-500">Failed to load issues.</p>';
  } finally {
    loader.style.display = "none";
  }
}

// Render cards function
function renderCards(filteredIssues) {
  cardContainer.innerHTML = "";
  issueCount.textContent = filteredIssues.length;

  filteredIssues.forEach(issue => {
    let borderColor = issue.status.toLowerCase() === "open" ? "border-t-green-500" : "border-t-purple-500";

    let priorityBg = "#EEEFF2";
    let priorityText = "#EF4444";
    if(issue.priority.toLowerCase() === "low") { priorityText = "#9CA3AF"; }
    else if(issue.priority.toLowerCase() === "medium") { priorityBg = "#FFF6D1"; priorityText = "#F59E0B"; }
    else if(issue.priority.toLowerCase() === "high") { priorityBg = "#FEECEC"; priorityText = "#EF4444"; }

    let statusImg = issue.status.toLowerCase() === "open" ? "assets/Open-Status.png" : "assets/Closed-Status.png";

    cardContainer.innerHTML += `
      <div class="shadow-md p-3 rounded-lg space-y-4 border-t-4 ${borderColor} hover:shadow-lg transition">
        <div class="flex justify-between items-center">
          <img class="h-7 bg-cover" src="${statusImg}" alt="">
          <p class="font-bold px-4 rounded-full py-1" style="color: ${priorityText}; background-color: ${priorityBg};">${issue.priority}</p>
        </div>
        <h2 class="font-bold text-gray-700">${issue.title}</h2>
        <p class="text-xs font-medium text-gray-500">${issue.description || ""}</p>
        <div class="flex gap-3 items-center">
          <p class="text-base font-medium flex items-center gap-1 bg-[#FEECEC] px-3 rounded-full py-1 text-[#EF4444]"><i class="fa-solid fa-bug"></i> BUG</p>
          <p class="text-base font-medium flex items-center gap-1 bg-[#FDE68A] px-4 rounded-full py-1 text-[#D97706]"><i class="fa-solid fa-life-ring"></i> HELP WANTED</p>
        </div>
        <hr>
        <div class="text-sm font-medium text-gray-500">
          <p>#1 by ${issue.author}</p>
          <p>1/15/2024</p>
        </div>
      </div>
    `;
  });
}

// Active tab styling
function setActiveTab(tab) {
  [allTab, openTab, closedTab].forEach(btn => {
    btn.classList.remove("bg-blue-500","text-white");
    btn.classList.add("bg-gray-100","text-black");
  });
  tab.classList.add("bg-blue-500","text-white");
  tab.classList.remove("bg-gray-100","text-black");
}

// Filter issues based on search & tab
function filterIssues() {
  const query = searchInput.value.toLowerCase();
  let filtered = issuesData.filter(issue => {
    const matchesQuery = issue.title.toLowerCase().includes(query) || (issue.description && issue.description.toLowerCase().includes(query));
    const matchesTab = (activeTab === "all") || (activeTab === "open" && issue.status.toLowerCase() === "open") || (activeTab === "closed" && issue.status.toLowerCase() === "closed");
    return matchesQuery && matchesTab;
  });
  renderCards(filtered);
}

// Tab click events
allTab.addEventListener("click", () => { activeTab="all"; setActiveTab(allTab); filterIssues(); });
openTab.addEventListener("click", () => { activeTab="open"; setActiveTab(openTab); filterIssues(); });
closedTab.addEventListener("click", () => { activeTab="closed"; setActiveTab(closedTab); filterIssues(); });

// Search input
searchInput.addEventListener("input", filterIssues);

// Initial fetch
fetchIssues();
</script>
