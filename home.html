<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home page GitHub issues tracker</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- DaisyUI -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@latest/dist/full.css"
      rel="stylesheet"
      type="text/css"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <!-- font family -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Geist", sans-serif;
      }
    </style>
  </head>
  <body>
    <!-- header section -->
    <section class="header-section">
      <!-- container -->
      <div class="md:w-11/12 mx-auto p-3">
        <!-- header container -->
        <div class="header-container md:flex md:justify-between space-y-3 ">
          <!-- img -->
          <div class="flex items-center gap-1">
            <img class="w-8" src="assets/github-logo.png" alt="" />
            <h1 class="text-xl font-bold">GitHub Issues Tracker</h1>
          </div>

          <!-- search input -->
          <div class="join w-full max-w-md gap-5">
            <input
              type="search"
              placeholder="Search issues..."
              required
              class="input input-bordered join-item w-full py-3"
            />
            <button type="button" class="btn btn-primary join-item rounded-lg">
              <i class="fa-solid fa-plus"></i> New Issue
            </button>
          </div>
        </div>
      </div>
    </section>
    <hr class="w-full" />

    <!-- tab section -->
    <section class="tab-section py-5 md:py-16">
      <!-- container -->
      <div class="max-w-screen-xl mx-auto shadow-md p-3 rounded-lg">
        <!-- tab container -->
        <div class="tab-container flex gap-2">
          <!-- all tab -->
          <button id="all-tab" class="btn btn-active btn-soft text-lg w-24">All</button>
          <!-- open tab  -->
          <button id="open-tab" class="btn btn-active btn-soft text-lg w-24">Open</button>
          <!-- closed tab -->
          <button id="closed-btn" class="btn btn-active btn-soft text-lg w-24">Closed</button>
        </div>
      </div>
    </section>


    <!-- issue section -->
    <section class="issue-section">
      <!-- container -->
      <div class="max-w-screen-xl mx-auto shadow-md p-3 rounded-lg">
        <!-- issue container -->
        <div class="issue-container flex justify-between items-center">

          <div class="flex gap-2 items-center">
            <img class="w-8 h-8"  src="assets/Aperture.png" alt="issue-icon">
            <div>
              <h2 class="md:text-lg font-bold"> <span id="issue-count">50</span> Issues</h2>
              <p class="text-xs md:text-base text-gray-500">Track and manage your project issues</p>
            </div>
          </div>

          <!-- open closed -->
          <div class="flex gap-2">
            <p class="flex items-center gap-1"><i class="fa-solid fa-circle text-[#00A96E]"></i> Open</p>
            <p class="flex items-center gap-1"><i class="fa-solid fa-circle text-[#A855F7]"></i> Closed</p>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
