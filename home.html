<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home page GitHub issues tracker</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- DaisyUI -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@latest/dist/full.css"
      rel="stylesheet"
      type="text/css"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <!-- font family -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Geist", sans-serif;
      }
       
    </style>
  </head>
  <body>
    <!-- header section -->
    <section class="header-section">
      <!-- container -->
      <div class="md:w-11/12 mx-auto p-3">
        <!-- header container -->
        <div class="header-container md:flex md:justify-between space-y-3 ">
          <!-- img -->
          <div class="flex items-center gap-1">
            <img class="w-8" src="assets/github-logo.png" alt="" />
            <h1 class="text-xl font-bold">GitHub Issues Tracker</h1>
          </div>

          <!-- search input -->
          <div class="relative join w-full max-w-md">

             <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 "></i>

            <input
              type="search"
              
              placeholder="Search issues..."
              required
              class="input input-bordered join-item w-full pl-8 py-3"
            />
            <button type="button" class="btn btn-primary join-item rounded-lg">
              <i class="fa-solid fa-plus"></i> New Issue
            </button>
          </div>
        </div>
      </div>
    </section>
    <hr class="w-full" />

    <!-- tab section -->
    <section class="tab-section py-5 md:pt-12">
      <!-- container -->
      <div class="max-w-screen-2xl mx-auto shadow-md p-3 rounded-lg">
        <!-- tab container -->
        <div class="tab-container flex gap-2">
          <!-- all tab -->
          <button id="all-tab" class="btn w-24 bg-blue-500 text-white">All</button>
          <!-- open tab  -->
          <button id="open-tab" class="btn w-24 bg-gray-100 text-black">Open</button>
          <!-- closed tab -->
          <button id="closed-tab" class="btn w-24 bg-gray-100 text-black">Closed</button>
        </div>
      </div>
    </section>


    <!-- issue section -->
    <section class="issue-section py-5">
      <!-- container -->
      <div class="max-w-screen-2xl mx-auto shadow-md p-3 rounded-lg">
        <!-- issue container -->
        <div class="issue-container flex justify-between items-center">

          <div class="flex gap-2 items-center">
            <img class="w-8 h-8"  src="assets/Aperture.png" alt="issue-icon">
            <div>
              <h2 class="md:text-lg font-bold"> <span id="issue-count">50</span> Issues</h2>
              <p class="text-xs md:text-base text-gray-500">Track and manage your project issues</p>
            </div>
          </div>

          <!-- open closed -->
          <div class="flex gap-2">
            <p class="flex items-center gap-1"><i class="fa-solid fa-circle text-[#00A96E]"></i> Open</p>
            <p class="flex items-center gap-1"><i class="fa-solid fa-circle text-[#A855F7]"></i> Closed</p>
          </div>
        </div>
      </div>
    </section>


    <!--card section  -->
    <section class="card-section">
      <!-- container -->
      <div class="max-w-screen-2xl mx-auto shadow-md p-4 rounded-lg">

        <!-- card-container -->
        <div id="all-issues" class="card-container grid sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">

         
      </div>
    </section>
  </body>
</html>

 <script>
  
  const cardContainer = document.getElementById('all-issues');

  fetch('https://phi-lab-server.vercel.app/api/v1/lab/issues')
  .then(res => res.json())
  .then(data => {

    const issues = data.data;

    issues.forEach(issue => {

         // Default border and bg
         let borderColor = 'border-t-[#00A96E]'
         let priorityBgClass = '#EEEFF2';
         let priorityTextClass = '#EF4444';
         let statusImg = 'assets/Open-Status.png'
          

         // Change for LOW priority 
         if(issue.priority.toLowerCase() ==='low') {
          borderColor = 'border-t-[#A855F7]'
          priorityBgClass = '#EEEFF2'; 
          priorityTextClass = '#9CA3AF';
          statusImg = 'assets/Closed- Status .png'
         } else if(issue.priority.toLowerCase() ==='medium') {
          priorityBgClass = '#FFF6D1'; 
          priorityTextClass = '#F59E0B';
          statusImg = 'assets/Open-Status.png'
         } else if(issue.priority.toLowerCase() === 'high') {
          priorityBgClass = '#FEECEC'
          priorityTextClass = '#EF4444';
          statusImg = 'assets/Open-Status.png'
         }
         
      cardContainer.innerHTML += `
       <!-- card -->
          <div class="shadow-md p-3 rounded-lg space-y-4 border-t-4 ${borderColor}  hover:shadow-lg transition">
            <div class="flex justify-between items-center">
              <img class="h-7 bg-cover" src="${statusImg}" alt="">
              <p class="font-bold px-4 rounded-full py-1"style="color: ${priorityTextClass}; background-color: ${priorityBgClass};">
              ${issue.priority}
            </p>
            </div>

            <h2 class="font-bold text-gray-700">${issue.title}</h2>
           <p class="text-xs font-medium text-gray-500">${issue.description}</p>
          
            <div class="flex gap-3 items-center ">
              <p class="text-base font-medium flex items-center gap-1 bg-[#FEECEC] px-3 rounded-full py-1 text-[#EF4444]">
                <i class="fa-solid fa-bug"></i>
                BUG</p>
              <p class="text-base font-medium flex items-center gap-1 bg-[#FDE68A]  px-4 rounded-full py-1 text-[#D97706]">
                <i class="fa-solid fa-life-ring"></i>
                HELP WANTED</p>
            </div>

            <hr>

            <div class="text-sm font-medium text-gray-500">
              <p>#1 by john_doe</p>
              <p>1/15/2024</p>
            </div>
          </div>
        </div>

      `
    })
  })

const allTab = document.getElementById('all-tab');
const openTab = document.getElementById('open-tab');
const closedTab = document.getElementById('closed-tab');
// const cardContainer = document.getElementById('all-issues');
// 
 

let issuesData = []; // store all fetched issues

// Fetch all issues on page load
fetch('https://phi-lab-server.vercel.app/api/v1/lab/issues')
  .then(res => res.json())
  .then(data => {
    issuesData = data.data;
    renderCards(issuesData); // show all by default
  })
  .catch(err => console.error('Fetch Error:', err));

// Function to set active tab style
function setActiveTab(tab) {
  [allTab, openTab, closedTab].forEach(btn => {
    btn.classList.remove('bg-blue-500', 'text-white'); // remove active
    btn.classList.add('bg-gray-100', 'text-black');    // inactive
  });
  tab.classList.add('bg-blue-500', 'text-white');      // clicked tab active
  tab.classList.remove('bg-gray-100', 'text-black');
}
const issueCount = document.getElementById('issue-count');

// Update count whenever renderCards is called
function renderCards(filteredIssues) {
  cardContainer.innerHTML = ''; // clear previous cards
  issueCount.textContent = filteredIssues.length; // update count dynamically

  filteredIssues.forEach(issue => {
    let borderColor = (issue.status.toLowerCase() === 'open') ? 'border-t-green-500' : 'border-t-purple-500';
    let priorityBg = '#EEEFF2';
    let priorityText = '#EF4444';
    
    if(issue.priority.toLowerCase() === 'low'){
      priorityBg = '#EEEFF2';
      priorityText = '#9CA3AF';
    } else if(issue.priority.toLowerCase() === 'medium'){
      priorityBg = '#FFF6D1';
      priorityText = '#F59E0B';
    } else if(issue.priority.toLowerCase() === 'high'){
      priorityBg = '#FEECEC';
      priorityText = '#EF4444';
    }

    cardContainer.innerHTML += `
      <div class="shadow-md p-3 rounded-lg space-y-4 border-t-4 ${borderColor} hover:shadow-lg transition">
        <div class="flex justify-between items-center">
          <img class="h-7 bg-cover" src="assets/Open-Status.png" alt="">
          <p class="font-bold px-4 rounded-full py-1" style="color: ${priorityText}; background-color: ${priorityBg};">
            ${issue.priority}
          </p>
        </div>
        <h2 class="font-bold text-gray-700">${issue.title}</h2>
        <p class="text-xs font-medium text-gray-500">${issue.description}</p>
        <div class="flex gap-3 items-center">
          <p class="text-base font-medium flex items-center gap-1 bg-[#FEECEC] px-3 rounded-full py-1 text-[#EF4444]">
            <i class="fa-solid fa-bug"></i> BUG
          </p>
          <p class="text-base font-medium flex items-center gap-1 bg-[#FDE68A] px-4 rounded-full py-1 text-[#D97706]">
            <i class="fa-solid fa-life-ring"></i> HELP WANTED
          </p>
        </div>
        <hr>
        <div class="text-sm font-medium text-gray-500">
          <p>#1 by ${issue.author}</p>
          <p>1/15/2024</p>
        </div>
      </div>
    `;
  });
}

// Tab click events
allTab.addEventListener('click', () => {
  setActiveTab(allTab);
  renderCards(issuesData); // show all
});

openTab.addEventListener('click', () => {
  setActiveTab(openTab);
  const openIssues = issuesData.filter(issue => issue.status.toLowerCase() === 'open');
  renderCards(openIssues); // show only open
});

closedTab.addEventListener('click', () => {
  setActiveTab(closedTab);
  const closedIssues = issuesData.filter(issue => issue.status.toLowerCase() === 'closed');
  renderCards(closedIssues); // show only closed
});

 </script>
