<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Github Issue Tracer</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- DaisyUI -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@latest/dist/full.css"
      rel="stylesheet"
      type="text/css"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <!-- font family -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Geist", sans-serif;
      }
    </style>
  </head>
  <body>
    <!-- login page -->
    <section class="login-page py-20">
      <!-- container -->
      <div class="max-w-[500px] mx-auto p-5 shadow-2xl rounded-xl">
        <!-- login container -->
        <div class="login-container">
          <!-- image -->
          <div class="p-8 border border-black space-y-3 rounded-lg shadow-lg">
            <img
              class="w-16 mx-auto"
              src="assets/github-logo.png"
              alt="github-logo"
            />
            <h1 class="text-xl font-bold text-center">GitHub Issues Tracker</h1>
            <p class="text-sm font-medium text-center">
              Sign in to manage your issues
            </p>
          </div>

          <!-- input form -->
          <form  id="loginForm" class="space-y-5 pt-5" autocomplete="off">
            <fieldset class="fieldset rounded-box w-full" >

              <label class="label">Username</label>
              <input id="username" type="text" class="input input-bordered w-full" placeholder="Enter Username" />

              <label class="label">Password</label>
              <input id="password" autocomplete="new-password" type="password" class="input   input-bordered w-full" placeholder="Password" />

              <button id="sign-btn" class="btn btn-primary mt-4 w-full">Sign In</button>
            </fieldset>

            <div class="flex items-center gap-3">
              <hr class="flex-1 border-gray-300">
                 <span class="text-gray-500 font-medium">OR</span>
              <hr class="flex-1 border-gray-300">
            </div>
            
            <p class="text-center text-gray-400">Demo Credentials:</p>

            <div class="shadow-md text-center rounded-lg py-5">
              <p class="font-medium">Username: admin</p>
              <p class="font-medium">Password: admin123</p>
            </div>

              <p id="message" class="text-center mt-2 text-red-500"></p>

          </form>
        </div>
      </div>
    </section>
  </body>
</html>

 <script src="login.js"></script>
